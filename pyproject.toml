[project]
name = "agent-fugue"
version = "0.1.0"
description = "Ask two to four coding agents (Claude Code, Codex, DeepSeek) the same question, then let them review each other."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5",
]

[project.scripts]
fugue = "fugue.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fugue"

[dependency-groups]
dev = ["pytest>=8"]

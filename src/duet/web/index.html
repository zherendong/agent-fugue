<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="duet-token" content="__DUET_TOKEN__">
<meta name="color-scheme" content="light dark">
<title>duet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23c2410c' fill-opacity='.85'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%232563eb' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="logo"><span class="logo-mark" aria-hidden="true"></span>duet</span>
      <a class="btn primary small" href="#/new">New question</a>
    </div>
    <nav id="list" aria-label="Discussions"></nav>
    <div class="side-foot">
      <button id="notify" class="btn ghost small" type="button" hidden>Notify me when a discussion needs me</button>
    </div>
  </aside>
  <main id="main">
    <div id="content"></div>
    <div id="composer" hidden>
      <div id="pending"></div>
      <div class="composer-box">
        <div class="modes" role="group" aria-label="What to send">
          <button type="button" data-mode="both" class="on">Note to both</button>
          <button type="button" data-mode="claude">Note to Claude</button>
          <button type="button" data-mode="codex">Note to Codex</button>
          <button type="button" data-mode="ask">Follow-up question</button>
        </div>
        <textarea id="composer-text" rows="2" aria-label="Message"></textarea>
        <div class="composer-foot">
          <span id="composer-hint" class="muted"></span>
          <button id="composer-send" type="button" class="btn primary small">Send</button>
        </div>
      </div>
    </div>
  </main>
</div>
<dialog id="prompt-dialog">
  <div class="dialog-head">
    <h2 id="prompt-title"></h2>
    <button type="button" id="prompt-copy" class="btn small">Copy</button>
    <button type="button" id="prompt-close" class="btn ghost small">Close</button>
  </div>
  <pre id="prompt-text"></pre>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>

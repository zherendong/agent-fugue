<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fugue-token" content="__FUGUE_TOKEN__">
<meta name="color-scheme" content="light dark">
<title>fugue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23c2410c' fill-opacity='.85'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%232563eb' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="logo"><span class="logo-mark" aria-hidden="true"></span>fugue</span>
      <a class="btn small" href="#/new">New question</a>
    </div>
    <nav id="list" aria-label="Discussions"></nav>
    <div class="side-foot">
      <a class="btn ghost small" href="#/settings">Settings</a>
    </div>
  </aside>
  <main id="main">
    <div id="content"></div>
    <div id="composer" hidden>
      <div class="composer-box">
        <select id="composer-mode" aria-label="Send to"></select>
        <textarea id="composer-text" rows="1" aria-label="Message"></textarea>
        <span id="composer-actions" class="bar-actions"></span>
        <div id="composer-files"></div>
        <div id="composer-hint" class="muted"></div>
      </div>
    </div>
  </main>
</div>
<dialog id="context-dialog" aria-label="What a member saw"></dialog>
<div id="nav-backdrop"></div>
<div id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
